      href="/icons/favicon-48.png"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5c0000" />
    <!-- iPhone: open from the home screen without Safari's address bar, with this name. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TT Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Theta Tau Hub</title>
    <!-- iPhone launch images: maroon with the gray logo, so there is no black screen. -->

      rel="apple-touch-startup-image"

    <link
      rel="apple-touch-startup-image"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"

    <link

    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/640x1136.png"
    />
    <script>
      // In the installed iPhone app the page starts below the status bar, so the middle of the
      // page is lower than the middle of the launch image. This measures that gap before the
      // first paint, so the logo can be shifted up by half of it and stay in the same spot.
      (function () {
        var installed =
          navigator.standalone ||
          window.matchMedia("(display-mode: standalone)").matches;
        var gap = screen.height - innerHeight;
        if (installed && innerHeight > innerWidth && gap > 0 && gap < 100) {
          document.documentElement.style.setProperty(
            "--status-bar",
            gap + "px",
          );
        }
      })();
    </script>
    <style>
      html {
        background: #5c0000;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- What the intro screen shows at its first frame. React replaces it when it starts. -->
      <div class="fixed inset-0 grid place-items-center bg-maroon-700">
        <div
          class="relative w-56 max-w-[60vw]"
          style="transform: translateY(calc(var(--status-bar, 0px) / -2))"
        >
          <img
            src="/logo.png"
            alt=""
            class="block w-full opacity-60 grayscale"
          />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
